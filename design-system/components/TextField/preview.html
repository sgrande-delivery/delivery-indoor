<!-- @dsCard group="Formulário" height=400 -->
<div class="bp" style="padding:20px;background:var(--page);min-height:100%;">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;max-width:640px">
  <label class="bp-field"><span class="bp-label">E-mail</span><span class="bp-input"><input placeholder="seu@email.com"></span></label>
  <label class="bp-field"><span class="bp-label">Foco</span><span class="bp-input bp-input--focus"><input value="joao@email.com"></span></label>
  <label class="bp-field"><span class="bp-label">Com ícone</span><span class="bp-input"><span class="msr">mail</span><input value="joao@email.com"></span></label>
  <label class="bp-field"><span class="bp-label">Senha</span><span class="bp-input bp-input--error"><span class="msr">lock</span><input value="senha" type="password"><span class="msr">error</span></span><span class="bp-helper bp-helper--error"><span class="msr">error</span>Mínimo de 8 caracteres.</span></label>
  <label class="bp-field"><span class="bp-label">Pagamento</span><span class="bp-input bp-select"><span class="msr">credit_card</span>Cartão de crédito<span class="msr">expand_more</span></span></label>
  <label class="bp-field"><span class="bp-label">Observação</span><span class="bp-input"><input placeholder="Ex.: sem cebola"></span><span class="bp-helper">Até 140 caracteres.</span></label>
</div>
</div>
