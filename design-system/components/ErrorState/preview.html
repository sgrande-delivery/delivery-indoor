<!-- @dsCard group="Feedback" height=520 -->
<div class="bp" style="padding:20px;background:var(--page);min-height:100%;">
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;max-width:760px">
  <div style="background:var(--page);border:1px solid var(--line);border-radius:20px;padding-top:28px">
    <div class="bp-error"><span class="bp-error__circle"><span class="msr">cloud_off</span></span><div class="bp-error__title">Não conseguimos carregar</div><div class="bp-error__description">Algo falhou na conexão com o restaurante. Verifique sua internet e tente de novo.</div><span class="bp-error__reference">erro <b>503</b> · req_8f24c1</span></div>
    <div class="bp-error__actions"><button class="bp-btn bp-btn--block"><span class="msr">refresh</span>Tentar novamente</button><button class="bp-btn bp-btn--ghost">Voltar ao início</button></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:12px">
    <div class="bp-error-inline"><span class="msr">error</span><span class="bp-error-inline__text"><b>Falha ao carregar os cupons</b>O resto da página continua funcionando.</span><button class="bp-btn bp-btn--sm bp-btn--neutral">Recarregar</button></div>
    <div class="bp-offline" style="border-radius:14px"><span class="msr">wifi_off</span>Sem conexão<span class="bp-offline__action">Reconectar</span></div>
  </div>
</div>
</div>
