<!-- @dsCard group="Seleção" height=190 -->
<div class="bp" style="padding:20px;background:var(--page);min-height:100%;">
<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
  <span class="bp-badge bp-badge--discount">-30%</span>
  <span class="bp-badge bp-badge--offer">OFERTA</span>
  <span class="bp-badge bp-badge--chrome">NOVO</span>
  <span class="bp-badge bp-badge--status">Aberto agora</span>
  <span class="bp-badge bp-badge--accent">Mais pedido</span>
  <span class="bp-badge bp-badge--count">2</span>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;padding:14px;background:var(--card);border-radius:16px">
  <span class="bp-order-status bp-order-status--pending-payment">Aguardando pagamento</span>
  <span class="bp-order-status bp-order-status--open">Aberto</span>
  <span class="bp-order-status bp-order-status--approved">Em preparo</span>
  <span class="bp-order-status bp-order-status--dispatched">Saiu para entrega</span>
  <span class="bp-order-status bp-order-status--completed">Concluído</span>
  <span class="bp-order-status bp-order-status--cancelled">Cancelado</span>
</div>
</div>
