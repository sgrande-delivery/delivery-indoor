<div class="bp" style="padding:20px;background:var(--overlay);min-height:100%;display:flex;align-items:center;justify-content:center">
  <div class="bpi-name">
    <div class="bpi-name__head">
      <div class="bpi-name__badge"><span class="msr">badge</span></div>
      <div style="flex:1">
        <div class="bpi-name__title">Como podemos te chamar?</div>
        <div class="bpi-name__body">Seu nome aparece na conta da mesa para identificar o que é de quem. Só pedimos uma vez.</div>
      </div>
      <button class="bp-icon-btn bp-icon-btn--plain bp-icon-btn--sm"><span class="msr">close</span></button>
    </div>
    <div class="bp-field" style="margin-top:16px">
      <input class="bp-input" placeholder="Seu nome" value="Marina">
    </div>
    <div class="bp-helper bp-helper--error" style="margin-top:6px"><span class="msr">error</span>Informe seu nome para enviar o pedido</div>
    <button class="bp-btn bp-btn--block bp-btn--split" style="margin-top:14px"><span>Enviar pedido</span><span>R$ 53,80</span></button>
  </div>
</div>
