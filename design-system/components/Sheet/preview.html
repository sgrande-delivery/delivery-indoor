<div class="bp" style="padding:20px;background:var(--page);min-height:100%;">
<div style="position:relative;height:340px;max-width:372px;border-radius:20px;overflow:hidden;background:var(--page)">
  <div class="bp-backdrop"></div>
  <div class="bp-sheet" style="position:absolute;left:0;right:0;bottom:0">
    <div class="bp-sheet__handle"></div>
    <div class="bp-sheet__header"><div style="flex:1"><div class="bp-sheet__title">Ordenar por</div><div class="bp-sheet__subtitle">7 resultados para “cheddar”</div></div><button class="bp-icon-btn bp-icon-btn--plain" aria-label="Fechar"><span class="msr">close</span></button></div>
    <div class="bp-sheet__body" style="display:flex;flex-direction:column;gap:14px">
      <label class="bp-choice"><span class="bp-radio bp-radio--on"></span>Mais vendidos</label>
      <label class="bp-choice"><span class="bp-radio"></span>Menor preço</label>
    </div>
    <div class="bp-sheet__footer"><button class="bp-btn bp-btn--block">Ver 7 resultados</button></div>
  </div>
</div>
</div>
