<!-- @dsCard group="Pagamento" height=560 -->
<div class="bp" style="padding:20px;background:var(--page);min-height:100%">
  <div class="bpi-pix">
    <div class="bpi-bill__label">Valor do Pix</div>
    <div class="bpi-pix__value">R$ 95,43</div>
    <div class="bpi-pix__expiry"><span class="msr">timer</span>Expira em 09:42</div>
    <div class="bpi-pix__qr"><span class="msr">qr_code_2</span></div>
    <div class="bpi-pix__hint">Mostre o QR para pagar de outro celular</div>
    <div class="bpi-pix__wait"><span class="msr">progress_activity</span>Aguardando pagamento…</div>
    <div class="bpi-pix__hint">A conta da mesa atualiza sozinha quando o Pix cair.</div>
    <div class="bpi-pix__steps">
      <div class="bpi-pix__step"><i>1</i>Copie o código Pix abaixo</div>
      <div class="bpi-pix__step"><i>2</i>No app do seu banco, escolha Pix › Copia e cola</div>
      <div class="bpi-pix__step"><i>3</i>Confira o valor e confirme</div>
    </div>
    <button class="bp-btn bp-btn--block" style="margin-top:16px"><span class="msr">content_copy</span>Copiar código Pix</button>
    <button class="bp-btn bp-btn--ghost" style="margin-top:4px">Trocar forma de pagamento</button>
  </div>
</div>
