<div class="bp" style="padding:20px;background:var(--page);min-height:100%;">
<div style="display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap">
  <div class="bp-list-item" style="width:340px">
    <span class="bp-skeleton bp-skeleton--circle" style="width:60px;height:60px;border-radius:14px"></span>
    <div style="flex:1;display:flex;flex-direction:column;gap:8px"><span class="bp-skeleton bp-skeleton--text" style="width:58%"></span><span class="bp-skeleton bp-skeleton--text" style="width:86%"></span><span class="bp-skeleton" style="height:18px;width:72px"></span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:10px;width:200px">
    <span class="bp-skeleton bp-skeleton--circle"></span>
    <span class="bp-skeleton bp-skeleton--text"></span>
    <span class="bp-skeleton" style="height:52px;border-radius:14px"></span>
    <button class="bp-btn bp-btn--md bp-btn--loading"><span class="bp-spinner"></span>Enviando…</button>
  </div>
</div>
</div>
