<!-- @dsCard group="Conta da mesa" height=420 -->
<div class="bp" style="padding:20px;background:var(--page);min-height:100%;display:grid;gap:16px">
  <div class="bpi-bill">
    <div class="bpi-bill__head">
      <span class="bp-chip bp-chip--sm">Mesa 12 · conta aberta</span>
    </div>
    <div style="margin-top:12px">
      <div class="bpi-bill__label">Falta pagar</div>
      <div class="bpi-bill__due">R$ 95,43</div>
      <div class="bpi-bill__total">Total R$ 155,43</div>
    </div>
    <div class="bpi-bill__bar"><i style="width:39%"></i></div>
    <div class="bpi-bill__progress"><span>R$ 60,00 pagos</span><span>39%</span></div>
    <div class="bpi-bill__time">
      <span class="msr">schedule</span>
      <span>Mesa ocupada há <b style="color:var(--ink)">1h 24min</b> · desde 19:05</span>
    </div>
  </div>
  <div class="bpi-bill bpi-bill--paid">
    <span class="msr fill">check_circle</span>
    <div class="bpi-bill__label" style="margin-top:6px">Conta paga</div>
    <div class="bpi-bill__due">R$ 155,43</div>
    <div class="bpi-bill__total">Tudo certo. Obrigado pela visita!</div>
    <div class="bpi-bill__time" style="justify-content:center">
      <span class="msr">schedule</span>
      <span>Tempo de mesa <b style="color:var(--ink)">1h 52min</b> · 19:05 – 20:57</span>
    </div>
  </div>
</div>
