<!-- @dsCard group="Pagamento" height=300 -->
<div class="bp" style="padding:20px;background:var(--page);min-height:100%">
  <div class="bp-label" style="margin-bottom:10px">Quanto você vai pagar?</div>
  <div style="display:grid;gap:10px">
    <button class="bpi-opt bpi-opt--on">
      <span class="bpi-opt__radio"></span>
      <span class="bpi-opt__body"><span class="bpi-opt__t">Tudo que falta</span><span class="bpi-opt__s">Fecha a conta da mesa</span></span>
      <span class="bpi-opt__v">R$ 95,43</span>
    </button>
    <button class="bpi-opt">
      <span class="bpi-opt__radio"></span>
      <span class="bpi-opt__body"><span class="bpi-opt__t">Dividir igualmente</span><span class="bpi-opt__s">R$ 95,43 ÷ 2 pessoas</span></span>
      <span class="bpi-opt__v">R$ 47,72</span>
    </button>
    <button class="bpi-opt">
      <span class="bpi-opt__radio"></span>
      <span class="bpi-opt__body"><span class="bpi-opt__t">Outro valor</span><span class="bpi-opt__s">Ex.: só o que você consumiu</span></span>
      <span class="bpi-opt__v">R$ 50,00</span>
    </button>
  </div>
</div>
