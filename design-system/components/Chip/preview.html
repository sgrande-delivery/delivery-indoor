<div class="bp" style="padding:20px;background:var(--page);min-height:100%;">
<div style="display:flex;gap:8px;flex-wrap:wrap">
  <button class="bp-chip bp-chip--solid">🍔 Burgers</button>
  <button class="bp-chip">🍟 Combos</button>
  <button class="bp-chip"><span class="msr" style="color:var(--muted)">history</span>Recente</button>
  <button class="bp-chip bp-chip--brand"><span class="msr">tune</span>Filtros<span class="bp-chip__count">3</span></button>
</div>
<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:12px">
  <button class="bp-chip bp-chip--sm bp-chip--include"><span class="msr">add_circle</span>cheddar<span class="msr bp-chip__remove">close</span></button>
  <button class="bp-chip bp-chip--sm bp-chip--exclude"><span class="msr">do_not_disturb_on</span>cebola<span class="msr bp-chip__remove">close</span></button>
  <button class="bp-chip bp-chip--md">Burgers <span class="bp-chip__muted">7</span></button>
  <button class="bp-chip bp-chip--xs">picles</button>
</div>
</div>
