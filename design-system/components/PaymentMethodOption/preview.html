<!-- @dsCard group="Pagamento" height=360 -->
<div class="bp" style="padding:20px;background:var(--page);min-height:100%">
  <div class="bp-label" style="margin-bottom:10px">Forma de pagamento</div>
  <div style="display:grid;gap:10px">
    <button class="bpi-opt bpi-opt--on">
      <span class="bpi-opt__ico"><span class="msr">qr_code_2</span></span>
      <span class="bpi-opt__body"><span class="bpi-opt__t">Pix</span><span class="bpi-opt__s">Aprovação na hora</span></span>
      <span class="bpi-opt__radio"></span>
    </button>
    <button class="bpi-opt">
      <span class="bpi-opt__ico"><span class="msr">credit_card</span></span>
      <span class="bpi-opt__body"><span class="bpi-opt__t">Cartão de crédito</span><span class="bpi-opt__s">Digitar na hora</span></span>
      <span class="bpi-opt__radio"></span>
    </button>
    <button class="bpi-opt">
      <span class="bpi-opt__ico"><span class="msr">account_balance_wallet</span></span>
      <span class="bpi-opt__body"><span class="bpi-opt__t">Google Pay</span><span class="bpi-opt__s">No seu celular, por QR</span></span>
      <span class="bpi-opt__radio"></span>
    </button>
    <button class="bpi-opt" disabled>
      <span class="bpi-opt__ico"><span class="msr">account_balance</span></span>
      <span class="bpi-opt__body"><span class="bpi-opt__t">NuPay</span><span class="bpi-opt__s">Indisponível: canal não homologado</span></span>
    </button>
  </div>
  <div style="font-size:11px;color:var(--muted);margin-top:10px">Opções online habilitadas pela Topezeira.</div>
</div>
