<div class="bp" style="padding:20px;background:var(--page);min-height:100%;">
<div style="display:flex;flex-direction:column;gap:10px;max-width:372px">
  <div class="bp-toast bp-toast--success"><span class="msr fill">check_circle</span><span class="bp-toast__message">Item adicionado à sacola</span><button class="bp-toast__action">Ver sacola</button></div>
  <div class="bp-toast bp-toast--error"><span class="msr fill">error</span><span class="bp-toast__message">Não foi possível aplicar o cupom</span><button class="bp-toast__action">Tentar</button></div>
  <div class="bp-toast bp-toast--warning"><span class="msr">wifi_off</span><span class="bp-toast__message">Você está offline. Reconectando…</span></div>
  <div class="bp-toast bp-toast--info"><span class="msr">local_shipping</span><span class="bp-toast__message">Pedido saiu para entrega</span></div>
</div>
</div>
